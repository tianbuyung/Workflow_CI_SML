name: CI - Retraining Model Likuiditas IDX

# Pemicu workflow:
#   push               — perubahan pada kode pelatihan, dataset, atau environment
#   workflow_dispatch  — dijalankan manual dengan hyperparameter yang bisa diubah
#   schedule           — pelatihan ulang berkala setiap Senin pukul 01:00 UTC
on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      n_estimators:
        description: "Jumlah pohon Random Forest"
        type: string
        required: false
        default: "746"
      max_depth:
        description: "Kedalaman maksimum pohon"
        type: string
        required: false
        default: "32"
      push_docker:
        description: "Bangun dan kirim image ke Docker Hub"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

concurrency:
  group: ci-retraining-${{ github.ref }}
  cancel-in-progress: true

env:
  NAMA_EKSPERIMEN: "IDX Likuiditas - CI Retraining"
  NAMA_IMAGE: tiandev/idx-liquidity-model

jobs:
  retraining:
    name: Latih ulang model dan bangun image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------------ #
      # Persiapan
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Siapkan Python 3.12.7
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.7"
          cache: pip

      - name: Pasang dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Penyimpanan berbasis berkas dipakai karena runner CI tidak menjalankan
      # MLflow Tracking Server. Jalur absolut agar tidak bergantung direktori kerja.
      - name: Tetapkan tracking URI berbasis berkas
        run: echo "MLFLOW_TRACKING_URI=file://${GITHUB_WORKSPACE}/MLProject/mlruns" >> "$GITHUB_ENV"

      # Penyimpanan berkas MLflow TIDAK portabel antar mesin: berkas meta.yaml
      # menyimpan artifact_uri sebagai jalur absolut. Bila mlruns/ hasil mesin
      # lain ikut ter-checkout, MLflow akan mencoba menulis ke jalur asing
      # tersebut dan gagal dengan PermissionError.
      #
      # Karena itu setiap run CI selalu dimulai dari keadaan bersih. Artefak
      # yang di-commit kembali ke repositori adalah murni hasil CI ini, dengan
      # jalur yang konsisten dengan runner.
      - name: Bersihkan artefak MLflow dari run sebelumnya
        run: |
          rm -rf MLProject/mlruns MLProject/run_id.txt
          echo "Direktori mlruns disiapkan dalam keadaan bersih."

      # ------------------------------------------------------------------ #
      # Pelatihan lewat MLflow Project
      # ------------------------------------------------------------------ #
      - name: Jalankan MLflow Project
        run: |
          mlflow run MLProject \
            --env-manager=local \
            --experiment-name "${NAMA_EKSPERIMEN}" \
            -P n_estimators=${{ inputs.n_estimators || '746' }} \
            -P max_depth=${{ inputs.max_depth || '32' }}

      - name: Ambil run ID hasil pelatihan
        id: run
        run: |
          RUN_ID="$(cat MLProject/run_id.txt)"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Run ID: ${RUN_ID}"

      # ------------------------------------------------------------------ #
      # Gerbang mutu — memastikan artefak yang dihasilkan benar-benar layak
      # ------------------------------------------------------------------ #
      - name: Validasi mutu model
        run: |
          python - <<'PY'
          import os, sys
          from mlflow.tracking import MlflowClient

          run_id = os.environ["RUN_ID"]
          c = MlflowClient(tracking_uri=os.environ["MLFLOW_TRACKING_URI"])
          m = c.get_run(run_id).data.metrics

          f1 = m.get("test_f1_macro", 0.0)
          naif = m.get("baseline_naif_f1_macro", 0.0)
          selisih = m.get("selisih_f1_makro_vs_naif", 0.0)

          print(f"F1 makro (uji)   : {f1:.4f}")
          print(f"Baseline naif    : {naif:.4f}")
          print(f"Selisih          : {selisih:+.4f}")

          # Artefak model wajib ada. Model yang di-serve adalah pembungkus
          # pyfunc, sehingga penandanya MLmodel — bukan model.pkl seperti pada
          # model sklearn biasa.
          jalur = [a.path for a in c.list_artifacts(run_id, "model")]
          if "model/MLmodel" not in jalur:
              print(f"GAGAL: artefak model tidak ditemukan. Isi: {jalur}")
              sys.exit(1)

          # Ambang keras: model yang jauh di bawah ini pasti bermasalah
          if f1 < 0.50:
              print(f"GAGAL: F1 makro {f1:.4f} di bawah ambang minimum 0.50")
              sys.exit(1)

          # Peringatan lunak: tidak menggagalkan CI, tetapi harus terlihat
          if selisih <= 0:
              print("::warning::Model tidak melampaui tolok ukur naif "
                    f"(selisih {selisih:+.4f}). Perlu ditinjau.")

          print("VALIDASI BERHASIL")
          PY
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}

      # ------------------------------------------------------------------ #
      # Penyimpanan artefak
      # ------------------------------------------------------------------ #
      - name: Unggah artefak model sebagai artifact
        uses: actions/upload-artifact@v7
        with:
          name: mlruns-${{ github.run_number }}
          path: MLProject/mlruns/
          retention-days: 90
          if-no-files-found: error

      # Salin run ke DagsHub agar riwayat pelatihan otomatis berkumpul bersama
      # eksperimen manual dari Kriteria 2. Dibuat tidak memblokir: kegagalan di
      # sini tidak boleh membatalkan tersimpannya artefak di repositori, yang
      # merupakan syarat sesungguhnya dari kriteria ini.
      - name: Salin run ke DagsHub
        continue-on-error: true
        env:
          DAGSHUB_REPO: tiandev/SMSML_Septian-Maulana
          MLFLOW_TRACKING_USERNAME: tiandev
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          python MLProject/mirror_to_dagshub.py \
            --run-id "${RUN_ID}" \
            --local-uri "${MLFLOW_TRACKING_URI}" \
            --experiment "${NAMA_EKSPERIMEN}"

      - name: Commit artefak terbaru ke repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add MLProject/mlruns/ MLProject/run_id.txt

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan artefak — commit dilewati."
          else
            git commit -m "chore(model): artefak hasil pelatihan ulang CI #${{ github.run_number }} [skip ci]"
            git push
            echo "Artefak berhasil dikembalikan ke repository."
          fi

      # ------------------------------------------------------------------ #
      # Docker Hub
      # ------------------------------------------------------------------ #
      # Secret tidak dapat dipakai langsung pada ekspresi `if:` di tingkat job,
      # jadi ketersediaannya diperiksa lebih dulu dan hasilnya dijadikan output.
      # Tanpa kredensial, seluruh langkah Docker dilewati dengan peringatan yang
      # terlihat — bukan menggagalkan CI. Pemenuhan kriteria Skilled (artefak
      # tersimpan di repositori) sudah selesai pada langkah-langkah sebelumnya.
      - name: Periksa ketersediaan kredensial Docker Hub
        id: kredensial
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "tersedia=true" >> "$GITHUB_OUTPUT"
            echo "Kredensial Docker Hub tersedia."
          else
            echo "tersedia=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret DOCKERHUB_USERNAME/DOCKERHUB_TOKEN belum disetel — langkah Docker Hub dilewati."
          fi

      - name: Login ke Docker Hub
        if: ${{ steps.kredensial.outputs.tersedia == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_docker) }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dua penyesuaian di bawah ini bukan pilihan gaya, melainkan keharusan
      # akibat ketidakcocokan pada versi pustaka yang dianjurkan kelas:
      #
      # 1. --env-manager local
      #    Secara bawaan build-docker memakai env-manager 'virtualenv', yang
      #    menghasilkan Dockerfile berbasis ubuntu:20.04 dengan Python 3.9 lalu
      #    mengunduh get-pip.py. Sejak pypa menghentikan dukungan Python 3.9,
      #    skrip itu menolak berjalan sehingga build selalu gagal. Dengan
      #    'local', MLflow memakai basis python:<versi>-slim dan memasang
      #    dependensi model langsung lewat pip.
      #
      # 2. TANPA --enable-mlserver
      #    MLflow 2.19.0 memasang MLServer 1.3.5, yang memanggil
      #    asyncio.get_event_loop() dan gagal di Python 3.12 dengan
      #    "There is no current event loop in thread 'MainThread'". Seluruh
      #    worker-nya crash sehingga model tidak pernah dimuat. Server scoring
      #    bawaan MLflow dipakai sebagai gantinya, mengekspos /ping dan
      #    /invocations yang justru lebih sesuai untuk kriteria monitoring.
      - name: Bangun image dengan mlflow build-docker
        if: ${{ steps.kredensial.outputs.tersedia == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_docker) }}
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${RUN_ID}/model" \
            --name "${NAMA_IMAGE}" \
            --env-manager local

      - name: Beri tag dan kirim ke Docker Hub
        if: ${{ steps.kredensial.outputs.tersedia == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_docker) }}
        run: |
          docker tag "${NAMA_IMAGE}" "${NAMA_IMAGE}:${{ github.run_number }}"
          docker push "${NAMA_IMAGE}:latest"
          docker push "${NAMA_IMAGE}:${{ github.run_number }}"
          echo "Image terkirim: ${NAMA_IMAGE}:latest dan :${{ github.run_number }}"

      # ------------------------------------------------------------------ #
      # Ringkasan
      # ------------------------------------------------------------------ #
      - name: Ringkasan hasil
        if: always()
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          {
            echo "### Hasil Pelatihan Ulang Otomatis"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Pemicu | \`${{ github.event_name }}\` |"
            echo "| Run ID MLflow | \`${RUN_ID:-tidak ada}\` |"
            echo "| Image Docker | \`${NAMA_IMAGE}:${{ github.run_number }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f MLProject/mlruns/*/"${RUN_ID}"/metrics/test_f1_macro ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "F1 makro: \`$(cat MLProject/mlruns/*/"${RUN_ID}"/metrics/test_f1_macro | awk '{print $2}')\`" >> "$GITHUB_STEP_SUMMARY"
          fi
